<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Design Thinking · Módulo 1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: oficina de quadro branco. Sumário lateral fixo + coluna de leitura de ~68ch; o caso aparece como notas adesivas, o resto fica quieto. */
:root{
  --paper:#F2F4F7; --surface:#FFFFFF; --ink:#17213A; --muted:#4F5A71; --line:#D5DCE6;
  --accent:#2A52C4; --accent-soft:#E6ECFB; --on-accent:#FFFFFF;
  --note-bg:#FFE37E; --note-ink:#2A2410; --note-bg-2:#FFD0C2; --note-bg-3:#C9EBD9;
  --ok:#1D714A; --ok-soft:#E3F3EA; --part:#8A5200; --part-soft:#FBF0DC; --bad:#A8261D; --bad-soft:#FBE7E5;
  --venn-1:rgba(42,82,196,.16); --venn-2:rgba(29,113,74,.16); --venn-3:rgba(168,38,29,.13);
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0F141D; --surface:#171E2B; --ink:#E7EBF3; --muted:#A6B0C4; --line:#2A3446;
  --accent:#86A2FF; --accent-soft:#1F2A47; --on-accent:#0C1120;
  --note-bg:#E9CC5E; --note-ink:#211C08; --note-bg-2:#E8AE9C; --note-bg-3:#A3D5BC;
  --ok:#62C493; --ok-soft:#14291F; --part:#E6AC52; --part-soft:#2E2412; --bad:#F2887E; --bad-soft:#341816;
  --venn-1:rgba(134,162,255,.20); --venn-2:rgba(98,196,147,.18); --venn-3:rgba(242,136,126,.16);
  color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0F141D; --surface:#171E2B; --ink:#E7EBF3; --muted:#A6B0C4; --line:#2A3446;
  --accent:#86A2FF; --accent-soft:#1F2A47; --on-accent:#0C1120;
  --note-bg:#E9CC5E; --note-ink:#211C08; --note-bg-2:#E8AE9C; --note-bg-3:#A3D5BC;
  --ok:#62C493; --ok-soft:#14291F; --part:#E6AC52; --part-soft:#2E2412; --bad:#F2887E; --bad-soft:#341816;
  --venn-1:rgba(134,162,255,.20); --venn-2:rgba(98,196,147,.18); --venn-3:rgba(242,136,126,.16);
  color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(1.85rem,4.2vw,2.6rem);font-weight:800;letter-spacing:-.01em}
h2{font-size:1.4rem;font-weight:700}
h3{font-size:1.1rem;font-weight:700}
p{margin:0}
.eyebrow{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lead{font-size:1.12rem;color:var(--muted)}

/* Topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.2;margin-right:auto;min-width:0}
.brand b{font-family:var(--f-display);font-size:1.02rem}
.brand span{font-size:.8rem;color:var(--muted)}
.prog{display:flex;align-items:center;gap:10px;font-size:.85rem;color:var(--muted)}
.prog-bar{width:150px;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.prog-bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.menu-btn{display:none}

/* Estrutura */
.shell{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:260px minmax(0,1fr);gap:40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px}
nav.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);align-self:start}
.toc ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.toc .grp{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 10px 4px}
.toc button{all:unset;box-sizing:border-box;width:100%;display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:.94rem;line-height:1.35}
.toc button:hover{background:var(--accent-soft)}
.toc button:focus-visible{outline:3px solid var(--accent)}
.dl{display:flex;gap:10px;align-items:flex-start;margin-top:16px;padding:12px 10px;border-top:1px solid var(--line);color:var(--ink);text-decoration:none;border-radius:8px;line-height:1.3}
.dl:hover{background:var(--accent-soft)}
.dl b{display:block;font-size:.94rem;color:var(--accent)}
.dl small{display:block;font-size:.8rem;color:var(--muted);margin-top:2px}
.dl-ic{flex:none;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.toc button[aria-current="page"]{background:var(--accent-soft);font-weight:700}
.st{flex:none;width:18px;height:18px;margin-top:1px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.68rem;font-weight:700}
.st.done{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.st.seen{border-color:var(--accent)}
main{min-width:0}
/* Área de conteúdo sempre clara, nos dois temas; o sumário e o topo mantêm as cores do tema */
main.content{
  --paper:#F6F8FB; --surface:#F8FAFC; --ink:#17213A; --muted:#55607A; --line:#E2E7EE;
  --accent:#2A52C4; --accent-soft:#EDF1FC; --on-accent:#FFFFFF;
  --note-bg:#FFE37E; --note-ink:#2A2410; --note-bg-2:#FFD3C6; --note-bg-3:#CDEEDC;
  --ok:#1D714A; --ok-soft:#EAF6EF; --part:#8A5200; --part-soft:#FDF4E4; --bad:#A8261D; --bad-soft:#FCEDEB;
  --venn-1:rgba(42,82,196,.12); --venn-2:rgba(29,113,74,.12); --venn-3:rgba(168,38,29,.10);
  color-scheme:light; background:#FFFFFF; color:var(--ink);
  border:1px solid var(--line); border-radius:16px; padding:32px clamp(18px,4vw,44px) 36px;
}
.screen{max-width:720px;display:flex;flex-direction:column;gap:22px}
.screen > h1{outline:none}

/* Componentes */
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.example{border-left:4px solid var(--note-bg);background:var(--surface);padding:14px 18px;border-radius:0 var(--r) var(--r) 0;display:flex;flex-direction:column;gap:6px}
.example .eyebrow{color:var(--ink)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.mini h3{font-size:1rem}
.mini p{font-size:.95rem;color:var(--muted)}
ul.plain{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:.95rem}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-display);font-weight:700;background:var(--paper)}
tr:last-child td{border-bottom:0}
.mono{font-family:var(--f-mono);font-size:.85em}

/* Notas adesivas do caso */
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;padding:6px 0}
.note{background:var(--note-bg);color:var(--note-ink);padding:16px 16px 18px;border-radius:3px;box-shadow:0 1px 0 rgba(0,0,0,.08),0 8px 18px -10px rgba(0,0,0,.35);transform:rotate(-1.2deg);display:flex;flex-direction:column;gap:4px}
.note:nth-child(2){background:var(--note-bg-2);transform:rotate(1deg)}
.note:nth-child(3){background:var(--note-bg-3);transform:rotate(-.4deg)}
.note:nth-child(4){transform:rotate(1.4deg)}
.note b{font-family:var(--f-display);font-size:1.9rem;line-height:1}
.note span{font-size:.92rem}
.quote{font-family:var(--f-display);font-size:1.25rem;font-weight:500;border-left:4px solid var(--ink);padding-left:16px}

/* Botões */
.btn{font:inherit;font-weight:700;font-size:.98rem;border-radius:8px;padding:10px 18px;cursor:pointer;border:2px solid var(--accent);background:var(--accent);color:var(--on-accent)}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.quiet{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:20px;margin-top:6px}

/* Formulários de atividade */
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;min-width:0}
legend{font-weight:700;margin-bottom:6px;padding:0}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:#FFFFFF;cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt input{margin-top:5px;accent-color:var(--accent);width:18px;height:18px;flex:none}
.opt:has(input:checked){border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.opt:has(input:disabled){cursor:default}
.cls-item{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.cls-item > p{font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{position:relative}
.chip input{position:absolute;opacity:0;width:1px;height:1px}
.chip span{display:inline-block;padding:6px 14px;border:2px solid var(--line);border-radius:99px;cursor:pointer;font-size:.92rem}
.chip input:checked + span{border-color:var(--accent);background:var(--accent);color:var(--on-accent);font-weight:700}
.chip input:focus-visible + span{outline:3px solid var(--accent);outline-offset:2px}
.chip input:disabled + span{cursor:default}
.err{color:var(--bad);font-weight:700;font-size:.95rem}
.cta{background:var(--accent-soft);border:1px solid var(--accent);border-radius:8px;padding:12px 16px;display:flex;flex-direction:column;gap:4px;font-size:.96rem}
.cta-h{font-weight:700;color:var(--accent);display:flex;gap:6px;align-items:center}
.cta ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.86rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;border:2px solid;margin-right:5px;vertical-align:-1px}

/* Feedback */
.fb{border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;border:1px solid}
.fb:focus{outline:3px solid var(--accent);outline-offset:2px}
.fb .v{font-weight:700;display:flex;gap:8px;align-items:center}
.fb.ok{background:var(--ok-soft);border-color:var(--ok)} .fb.ok .v{color:var(--ok)}
.fb.part{background:var(--part-soft);border-color:var(--part)} .fb.part .v{color:var(--part)}
.fb.bad{background:var(--bad-soft);border-color:var(--bad)} .fb.bad .v{color:var(--bad)}
.fb.info{background:var(--accent-soft);border-color:var(--accent)} .fb.info .v{color:var(--accent)}
.sym{font-family:var(--f-mono);font-size:1rem}

/* Simulador */
.scen-tabs{display:flex;gap:8px;flex-wrap:wrap}
.scen-tabs button{font:inherit;font-size:.88rem;font-weight:700;min-width:44px;height:44px;border-radius:8px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;padding:0 10px}
.scen-tabs button[aria-current="true"]{border-color:var(--accent);color:var(--accent)}
.scen-tabs button.s-ok{background:var(--ok-soft);border-color:var(--ok)}
.scen-tabs button.s-part{background:var(--part-soft);border-color:var(--part)}
.scen-tabs button.s-bad{background:var(--bad-soft);border-color:var(--bad)}
.scen{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:18px}
.tag{display:inline-block;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:var(--paper);border:1px solid var(--line);color:var(--muted)}
.score{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* Flashcards */
.card{min-height:250px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 24px -18px rgba(0,0,0,.4)}
.card.back{background:var(--accent-soft);border-color:var(--accent)}
.card .q{font-family:var(--f-display);font-size:1.3rem;font-weight:500;line-height:1.35}
.rate{display:flex;gap:8px;flex-wrap:wrap}

/* Síntese */
.status-list{display:flex;flex-direction:column;gap:10px}
.status{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.status .st{width:26px;height:26px;font-size:.85rem}
.status p{font-size:.95rem;color:var(--muted)}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.metric b{display:block;font-family:var(--f-display);font-size:1.7rem;font-variant-numeric:tabular-nums}
.metric span{font-size:.88rem;color:var(--muted)}
textarea{width:100%;min-height:160px;font-family:var(--f-mono);font-size:.8rem;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--paper);color:var(--ink)}

/* Início */
.hero{display:flex;flex-direction:column;gap:14px;padding:6px 0 4px}
.mods{display:flex;flex-direction:column;gap:8px}
.mod{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
.mod .n{font-family:var(--f-mono);font-size:.85rem;color:var(--muted);flex:none;width:28px}
.mod .t{flex:1;min-width:0}
.mod.on{border:2px solid var(--accent)}
.mod.off{opacity:.75}
.mod .tag{flex:none}
svg text{font-family:var(--f-body)}
.diagram{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;overflow-x:auto}
.diagram svg{display:block;width:100%;height:auto;min-width:300px}
.confirm{border:2px solid var(--bad);border-radius:var(--r);padding:16px;background:var(--bad-soft);display:flex;flex-direction:column;gap:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.warn-store{font-size:.9rem;color:var(--part);background:var(--part-soft);border:1px solid var(--part);border-radius:8px;padding:10px 14px}

@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr);gap:20px;padding-block:18px 56px}
  nav.toc{position:static;display:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px}
  nav.toc.open{display:block}
  .menu-btn{display:inline-flex}
  .prog-bar{width:90px}
}
@media (max-width:620px){
  .grid3,.grid2,.metrics{grid-template-columns:minmax(0,1fr)}
  body{font-size:16px}
  .scen,.card{padding:18px}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} .note{transform:none!important} }
</style>

<header class="top">
  <div class="top-in">
    <div class="brand"><b>Design Thinking</b><span>Maiara Machado · Design Educacional</span></div>
    <div class="prog" aria-live="polite"><span id="progLabel">0% concluído</span><div class="prog-bar" aria-hidden="true"><i id="progFill" style="width:0%"></i></div></div>
    <button class="btn quiet menu-btn" id="menuBtn" aria-expanded="false" aria-controls="toc">Sumário</button>
  </div>
</header>

<div class="shell">
  <nav class="toc" id="toc" aria-label="Sumário do módulo"></nav>
  <main id="main" class="content"></main>
</div>
<div class="sr" aria-live="polite" id="live"></div>

<script>
(function(){
"use strict";

/* ===================== DADOS ===================== */
var SCREENS = [
  {id:"inicio", title:"Início", grp:null},
  {id:"caso", title:"O caso Conecta", grp:"Abertura"},
  {id:"u1", title:"Começar pelas pessoas", grp:"Fundamentos"},
  {id:"u2", title:"Desejável, factível, viável", grp:"Fundamentos"},
  {id:"u3", title:"Divergir e convergir", grp:"Fundamentos"},
  {id:"u4", title:"Modelos, iteração e limites", grp:"Fundamentos"},
  {id:"sim", title:"Simulador: cabe Design Thinking?", grp:"Prática"},
  {id:"cards", title:"Flashcards situacionais", grp:"Prática"},
  {id:"fim", title:"Síntese do módulo", grp:"Fechamento"},
  {id:"ficha", title:"Ficha técnica da peça", grp:"Sobre"}
];
var CONTENT_SCREENS = ["caso","u1","u2","u3","u4","sim","cards"];

var OPENING = [
  {id:"a", text:"Aprovar a trilha de treinamento. É rápida de lançar e tem baixo risco.",
   back:"Você começou pela solução que a liderança propôs. É uma reação comum, e às vezes acerta. Mas, sem evidências, o treinamento pode atacar um sintoma. No Módulo 2 você vai ver o que aparece quando a hipótese é testada antes."},
  {id:"b", text:"Ouvir e observar colaboradores de perfis diferentes usando a plataforma.",
   back:"Você começou pela investigação. É o que o Design Thinking propõe quando o problema ainda não está claro. No Módulo 2 você vai conduzir essas entrevistas e descobrir se o treinamento resolve, para quem e em que parte."},
  {id:"c", text:"Pedir ao fornecedor novas funcionalidades para deixar a plataforma mais completa.",
   back:"Você começou por novas funcionalidades. Sem saber o que trava os usuários, mais funções podem aumentar a complexidade. O Módulo 2 ajuda a descobrir o que de fato falta."}
];

var CHECKS = {
  u1:{type:"single", title:"Verifique sua compreensão",
    prompt:"Qual destas formulações coloca as pessoas no centro do problema da Conecta?",
    options:[
      {id:"a", text:"Precisamos elevar o uso da Conecta para 90% até dezembro.", ok:false,
       fb:"Isso é uma meta da organização. Ela é legítima e ajuda a medir o resultado, mas não diz nada sobre quem usa a plataforma nem sobre o que essas pessoas enfrentam."},
      {id:"b", text:"Como ajudar técnicos de campo a registrar despesas no momento em que elas acontecem, mesmo com sinal fraco?", ok:true,
       fb:"A formulação nomeia um grupo de pessoas, uma situação real e uma dificuldade concreta. E não impõe uma solução: deixa espaço para várias respostas."},
      {id:"c", text:"Precisamos de um treinamento obrigatório para todos os colaboradores.", ok:false,
       fb:"Isso já é uma solução. Formular o problema como solução fecha a investigação antes de ela começar."}
    ],
    tip:"Releia os três princípios acima, em especial “Começar pelas pessoas”."},
  u2:{type:"classify", title:"Classifique as informações", cats:[["D","Desejabilidade"],["F","Factibilidade"],["V","Viabilidade"]],

var KEY = "mm-dt-m1-v1";
var storageOk = true;
function blank(){ return {v:1, current:"inicio", visited:{}, opening:null, checks:{}, sim:{}, simTries:{}, simIndex:0, cards:{}, cardIndex:0, cardFilter:false}; }
function load(){
  try{ var raw = localStorage.getItem(KEY); if(raw){ var o = JSON.parse(raw); if(o && o.v===1) return Object.assign(blank(), o); } }
  catch(e){ storageOk = false; }
  return blank();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); storageOk = true; } catch(e){ storageOk = false; } }

/* ===================== CÁLCULOS ===================== */
function totals(){
  var checksDone = Object.keys(CHECKS).filter(function(k){ return S.checks[k]; }).length;
  var simDone = SCENARIOS.filter(function(s){ return S.sim[s.id]; }).length;
  var cardsDone = CARDS.filter(function(c){ return S.cards[c.id]; }).length;
  var simPts = 0;
  SCENARIOS.forEach(function(s){ var r = S.sim[s.id]; if(r){ if(r.a===s.correct) simPts++; if(evOk(s,r.e)) simPts++; } });
  var done = (S.opening?1:0) + checksDone + simDone + cardsDone;
  var total = 1 + Object.keys(CHECKS).length + SCENARIOS.length + CARDS.length;
  return {done:done, total:total, pct:Math.round(done/total*100), checksDone:checksDone, simDone:simDone, cardsDone:cardsDone, simPts:simPts};
}
function evOk(s, eid){ var e = s.ev.filter(function(x){return x.id===eid;})[0]; return !!(e && e.ok); }
function screenDone(id){
  if(id==="caso") return !!S.opening;
  if(CHECKS[id]) return !!S.checks[id];
  if(id==="sim") return SCENARIOS.every(function(s){ return S.sim[s.id]; });
  if(id==="cards") return CARDS.every(function(c){ return S.cards[c.id]; });
  if(id==="fim") return totals().done===totals().total;
  return false;
}

/* ===================== UTIL ===================== */
function esc(t){ return String(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];}); }
function fbBox(kind, verdict, body, focusId){
  var sym = {ok:"✓", part:"◐", bad:"✕", info:"→"}[kind];
  return '<div class="fb '+kind+'"'+(focusId?' id="'+focusId+'" tabindex="-1"':'')+'><p class="v"><span class="sym" aria-hidden="true">'+sym+'</span>'+verdict+'</p>'+body+'</div>';
}
function announce(t){ var l = document.getElementById("live"); l.textContent = ""; setTimeout(function(){ l.textContent = t; }, 40); }
function idx(id){ for(var i=0;i<SCREENS.length;i++) if(SCREENS[i].id===id) return i; return 0; }
function pager(){
  var i = idx(S.current), prev = SCREENS[i-1], next = SCREENS[i+1];
  return '<div class="pager">'+
    (prev?'<button class="btn quiet" data-go="'+prev.id+'">← '+esc(prev.title)+'</button>':'<span></span>')+
    (next?'<button class="btn" data-go="'+next.id+'">'+esc(next.title)+' →</button>':'')+'</div>';
}
function cta(steps){
  var body = steps.length===1 ? '<p>'+steps[0]+'</p>' : '<ol>'+steps.map(function(s){ return '<li>'+s+'</li>'; }).join("")+'</ol>';
  return '<div class="cta"><p class="cta-h"><span aria-hidden="true">▸</span> O que fazer</p>'+body+'</div>';
}
function head(eyebrow, title){ return '<p class="eyebrow">'+eyebrow+'</p><h1 tabindex="-1" id="h1">'+title+'</h1>'; }

    }).join("")+'</fieldset>';
  } else {
    html += '<p><b>'+esc(c.prompt)+'</b></p>'+c.items.map(function(it){
      var given = r ? r.ans[it.id] : null;
      return '<fieldset class="cls-item"><legend class="sr">Item</legend><p>'+esc(it.text)+'</p><div class="chips">'+c.cats.map(function(cat){
        return '<label class="chip"><input type="radio" name="'+id+'-'+it.id+'" value="'+cat[0]+'"'+(given===cat[0]?" checked":"")+(r?" disabled":"")+'><span>'+cat[1]+'</span></label>';
      }).join("")+'</div>'+(r?itemFb(c,it,given):"")+'</fieldset>';
    }).join("");
  }
  if(ui.errors[id]) html += '<p class="err" role="alert">'+ui.errors[id]+'</p>';
  if(r){
    if(c.type==="single"){
      var o = c.options.filter(function(x){return x.id===r.ans;})[0];
      html += fbBox(o.ok?"ok":"bad", o.ok?"Formulação adequada":"Ainda não é essa", '<p>'+esc(o.fb)+'</p>'+(o.ok?'':'<p><b>Para revisar:</b> '+esc(c.tip)+'</p>'), "fb-"+id);
      if(!o.ok && ui.revealed[id]){
        var right = c.options.filter(function(x){return x.ok;})[0];
        html += fbBox("info","Resposta comentada",'<p><b>'+esc(right.text)+'</b></p><p>'+esc(right.fb)+'</p>');
      }
      html += '<div class="row"><button type="button" class="btn quiet" data-act="retry" data-id="'+id+'">Refazer</button>'+
        (!o.ok && !ui.revealed[id]?'<button type="button" class="btn ghost" data-act="reveal" data-id="'+id+'">Ver resposta comentada</button>':'')+'</div>';
    } else {
      var kind = r.score===r.total?"ok":(r.score===0?"bad":"part");
      var verdict = r.score===r.total?"Todas as classificações adequadas":(r.score===0?"Nenhuma classificação adequada":"Classificação parcial");
      html += fbBox(kind, verdict+' <span class="score">('+r.score+' de '+r.total+')</span>', r.score===r.total?'<p>Leia as explicações em cada item: elas reforçam o critério que diferencia as categorias.</p>':'<p><b>Para revisar:</b> '+esc(c.tip)+' A explicação de cada item está logo abaixo dele.</p>', "fb-"+id);
      html += '<div class="row"><button type="button" class="btn quiet" data-act="retry" data-id="'+id+'">Refazer</button></div>';
    }
  } else {
    html += '<div class="row"><button type="submit" class="btn">Verificar</button></div>';
  }
  var how = r ? "" : (c.type==="single"
    ? cta(["Marque a opção que você considera adequada e clique em <b>Verificar</b>."])
    : cta(["Para cada informação, clique em uma das categorias abaixo dela.", "Quando todos os itens estiverem classificados, clique em <b>Verificar</b>."]));
  return '<form class="box" id="f-'+id+'" data-check="'+id+'" novalidate><p class="eyebrow">'+esc(c.title)+'</p>'+how+html+'</form>';
}
function itemFb(c,it,given){
  var ok = given===it.ans;
  var name = c.cats.filter(function(x){return x[0]===it.ans;})[0][1];
  return '<p style="font-size:.95rem;color:'+(ok?"var(--ok)":"var(--bad)")+'"><b><span aria-hidden="true">'+(ok?"✓ ":"✕ ")+'</span>'+(ok?"Adequado.":"Não é essa. A categoria é "+name+".")+'</b> <span style="color:var(--ink)">'+esc(it.fb)+'</span></p>';
}

R.u1 = function(){

    '<p>Em vez de partir de uma resposta pronta, a equipe investiga necessidades, comportamentos e contexto, gera alternativas e testa cedo, com protótipos simples. A abordagem ganhou forma em escolas e consultorias de design, como a d.school de Stanford e a IDEO, e hoje é usada em serviços, processos e políticas, não só em produtos.</p>'+
    '<div class="grid3">'+
      '<div class="mini"><h3>Começar pelas pessoas</h3><p>Entender o que os usuários fazem, precisam e enfrentam antes de decidir o que construir.</p></div>'+

    '</div>'+
    '<div class="box"><h3>O que Design Thinking não é</h3><ul class="plain"><li>Uma oficina de post-its sem pesquisa com usuários.</li><li>Uma sequência fixa de etapas que garante inovação.</li><li>Um substituto para dados, análise ou gestão de projetos.</li></ul></div>'+
    '<div class="example"><p class="eyebrow">No caso Conecta</p><p>A proposta de treinamento parte de uma solução. Uma abordagem centrada no ser humano começaria perguntando: quem abandona as solicitações, em que momento e por quê?</p></div>'+

R.u4 = function(){
  return '<section class="screen">'+head("Unidade 4 · cerca de 7 min","Modelos, iteração e limites")+
    '<p class="lead">Existem vários modelos de Design Thinking. Eles descrevem a mesma lógica com recortes diferentes, e nenhum é uma receita fixa.</p>'+
    '<div class="table-wrap"><table><thead><tr><th>Modelo</th><th>Etapas ou espaços</th><th>Ênfase</th></tr></thead><tbody>'+
      '<tr><td><b>d.school (Stanford)</b></td><td>Empatizar, Definir, Idear, Prototipar, Testar</td><td>Modos de trabalho com ferramentas práticas para cada um</td></tr>'+
      '<tr><td><b>Duplo Diamante (Design Council)</b></td><td>Descobrir, Definir, Desenvolver, Entregar</td><td>Alternância entre divergir e convergir, no problema e na solução</td></tr>'+
      '<tr><td><b>Design centrado no ser humano (IDEO)</b></td><td>Inspiração, Ideação, Implementação</td><td>Três espaços amplos, da compreensão à solução em uso</td></tr>'+
    '</tbody></table></div>'+
    '<div class="box"><h3>Iterativo, não linear</h3><p>As etapas são modos de trabalho, não uma fila. Um teste pode revelar que o problema estava mal definido e mandar a equipe de volta à pesquisa. Isso não é falha: é o processo funcionando, e quanto mais cedo acontece, mais barato fica.</p></div>'+
    '<div class="grid2"><div class="mini"><h3>Quando costuma ajudar</h3><p>O problema está mal definido, as necessidades das pessoas são pouco conhecidas, há incerteza sobre qual solução funciona, ou o objetivo é criar algo novo.</p></div>'+
    '<div class="mini"><h3>Quando provavelmente não é a primeira escolha</h3><p>A causa pode ser rastreada em dados, a solução já está decidida e só falta executar, ou o problema é puramente técnico.</p></div></div>'+

    checkBlock("u4")+pager()+'</section>';

R.sim = function(){
  var i = Math.min(S.simIndex, SCENARIOS.length-1), s = SCENARIOS[i], r = S.sim[s.id];

    var rr = S.sim[x.id], cls = "";
    if(rr){ var p = (rr.a===x.correct?1:0)+(evOk(x,rr.e)?1:0); cls = p===2?"s-ok":(p===1?"s-part":"s-bad"); }
    var stateTxt = rr?(cls==="s-ok"?"adequado":(cls==="s-part"?"parcial":"inadequado")):"não respondido";
    return '<button type="button" data-scen="'+k+'" class="'+cls+'"'+(k===i?' aria-current="true"':'')+' aria-label="Cenário '+(k+1)+', '+stateTxt+'">'+(k+1)+'</button>';
  }).join("");

  }).join("");
  var fb = "";

    var aOk = r.a===s.correct, eOk = evOk(s,r.e), chosenEv = s.ev.filter(function(x){return x.id===r.e;})[0];

    var aName = APPROACHES.filter(function(x){return x[0]===r.a;})[0][1];
    var bestName = APPROACHES.filter(function(x){return x[0]===s.correct;})[0][1];

      '<p><b>Sobre o dado que você escolheu:</b> '+esc(chosenEv.fb)+'</p>'+
      (eOk?'':'<p><b>Dado mais forte:</b> '+esc(s.ev.filter(function(x){return x.ok;})[0].text)+'</p>');

  }

    cta(["Leia o cenário.", "No item 1, marque a abordagem que você recomenda.", "No item 2, marque o dado do cenário que mais sustenta sua decisão.", "Clique em <b>Confirmar decisão</b> e leia o feedback.", "Use os botões numerados para ir a qualquer cenário. Você pode refazer quantas vezes quiser."])+

    '<p class="score" style="color:var(--muted)">'+t.simDone+'/6 cenários · '+t.simPts+'/12 pontos</p></div>'+
    '<p class="legend" aria-hidden="true"><span><i style="border-color:var(--line)"></i>Não respondido</span><span><i style="border-color:var(--ok);background:var(--ok-soft)"></i>Adequado</span><span><i style="border-color:var(--part);background:var(--part-soft)"></i>Parcial</span><span><i style="border-color:var(--bad);background:var(--bad-soft)"></i>Inadequado</span></p>'+
    '<form class="scen" id="f-sim" novalidate><div class="row"><span class="tag">'+esc(s.tag)+'</span><span class="eyebrow">Cenário '+(i+1)+' de 6</span></div>'+
      '<h2>'+esc(s.title)+'</h2><p>'+esc(s.text)+'</p>'+
      '<fieldset><legend>1. Qual abordagem você recomenda?</legend>'+ap+'</fieldset>'+
      '<fieldset><legend>2. Qual dado do cenário mais sustenta sua decisão?</legend>'+ev+'</fieldset>'+
      (ui.errors.sim?'<p class="err" role="alert">'+ui.errors.sim+'</p>':'')+

    '</form>'+
    '<p style="font-size:.92rem;color:var(--muted)">Cada cenário vale 2 pontos: 1 pela abordagem e 1 pelo dado que a sustenta. Escolher a abordagem certa pelo motivo errado conta como resposta parcial, porque em um caso real esse raciocínio falharia no próximo problema.</p>'+
    pager()+'</section>';

    progresso:t.pct+"%", respostaInicial:op?op.text:null,
    checagens:Object.keys(CHECKS).map(function(k){ var r=S.checks[k]; return {unidade:k, pontos:r?r.score:null, total:r?r.total:null}; }),
    simulador:SCENARIOS.map(function(s){ var r=S.sim[s.id]; return {cenario:s.title, abordagem:r?r.a:null, abordagemAdequada:s.correct, dado:r?r.e:null, dadoAdequado:r?evOk(s,r.e):null, tentativas:S.simTries[s.id]||0}; }),
    pontosSimulador:t.simPts+"/12", flashcardsAutoavaliacao:cardStats,
    status:{participacao:visitedAll, conclusao:allDone, desempenhoDemonstrado:demonstrated}};
  return '<section class="screen">'+head("Fechamento","Síntese do módulo")+
    '<div class="metrics"><div class="metric"><b>'+t.pct+'%</b><span>atividades concluídas</span></div>'+
    '<div class="metric"><b class="score">'+t.simPts+'/12</b><span>pontos no simulador</span></div>'+
    '<div class="metric"><b>'+cardStats.ok+'/6</b><span>flashcards que você marcou como acertados</span></div></div>'+
    '<div><h2 style="margin-bottom:10px">Seus status neste módulo</h2><div class="status-list">'+
      stRow(visitedAll,"Participação","Você passou por todas as telas de conteúdo e prática.")+
      stRow(allDone,"Conclusão das atividades","Você respondeu a abertura, as quatro checagens, os seis cenários e avaliou os seis flashcards.")+
      stRow(demonstrated,"Desempenho demonstrado","Pelo menos 9 de 12 pontos no simulador. É o único critério verificado automaticamente neste módulo, porque depende de regras objetivas. A autoavaliação dos flashcards não entra nesta conta.")+
    '</div></div>'+
    (op?'<div class="box"><p class="eyebrow">De volta à sua primeira resposta</p><p><b>Você escolheu:</b> '+esc(op.text)+'</p><p>'+esc(op.back)+'</p></div>':
      '<div class="box"><p class="eyebrow">Sua primeira resposta</p><p>Você ainda não registrou o que faria primeiro no caso Conecta.</p><div class="row"><button class="btn ghost" data-go="caso">Registrar agora</button></div></div>')+
    (!demonstrated && t.simDone===6?fbBox("part","Para chegar ao desempenho demonstrado","<p>Volte aos cenários marcados como parciais ou inadequados no simulador. Releia a explicação e refaça: o objetivo é que a decisão e o dado que a sustenta caminhem juntos.</p>"):"")+
    '<div class="box"><p class="eyebrow">Próximo passo no caso</p><h3>Módulo 2: Empatia e descoberta</h3><p>Você vai entrevistar quatro colaboradores do Grupo Vértice, com perfis bem diferentes, e descobrir se o treinamento resolve, para quem e em que parte do problema.</p><p style="color:var(--muted);font-size:.92rem">O Módulo 2 não faz parte desta amostra.</p></div>'+
    '<div class="box"><h3>Exportar minhas respostas</h3><p>Copie o registro abaixo para guardar ou enviar a um tutor.</p><label for="exportBox" class="sr">Registro em JSON</label><textarea id="exportBox" readonly>'+esc(JSON.stringify(exportObj,null,2))+'</textarea>'+
    '<div class="row"><button class="btn quiet" data-act="copy">Copiar registro</button><span id="copyMsg" role="status" style="font-size:.92rem;color:var(--muted)"></span></div></div>'+
    '<div class="box"><h3>Recomeçar o módulo</h3>'+
      (ui.confirmReset?'<div class="confirm" role="alertdialog" aria-labelledby="cfT"><p id="cfT"><b>Apagar todas as respostas deste módulo?</b> Essa ação não pode ser desfeita.</p><div class="row"><button class="btn danger" data-act="resetyes">Sim, apagar e recomeçar</button><button class="btn quiet" data-act="resetno">Cancelar</button></div></div>'
       :'<p>Apaga as respostas salvas neste navegador e volta ao início.</p><div class="row"><button class="btn quiet" data-act="reset">Recomeçar o módulo</button></div>')+'</div>'+
    pager()+'</section>';
};

R.ficha = function(){
  return '<section class="screen">'+head("Sobre esta peça","Ficha técnica")+
    '<p class="lead">Amostra de portfólio: o primeiro módulo de um curso de seis, desenvolvido como objeto completo e funcional.</p>'+
    '<div class="table-wrap"><table><tbody>'+
      '<tr><th>Público</th><td>Profissionais de gestão, processos, inovação e atendimento; nível introdutório</td></tr>'+
      '<tr><th>Modalidade</th><td>Autoinstrucional, assíncrona, cerca de 40 minutos</td></tr>'+
      '<tr><th>Objetivo principal</th><td>Avaliar se o Design Thinking é adequado a um problema organizacional e justificar a escolha com dados do cenário (Bloom revisado: Avaliar)</td></tr>'+
      '<tr><th>Estratégia</th><td>Caso integrador que atravessa o curso, microunidades com checagem imediata, simulador de decisão com justificativa e flashcards situacionais</td></tr>'+
      '<tr><th>Avaliação</th><td>Formativa em todas as atividades, com feedback explicativo e caminho de revisão. Critério automático apenas onde há regra objetiva (simulador). Autoavaliação explícita nos flashcards. Três status separados: participação, conclusão e desempenho</td></tr>'+
      '<tr><th>Acessibilidade</th><td>WCAG 2.2 AA como referência: HTML semântico, controles nativos operáveis por teclado, foco visível, feedback com texto e símbolo além da cor, mensagens dinâmicas anunciadas, respeito a movimento reduzido, temas claro e escuro. Ainda não auditado com leitores de tela.</td></tr>'+
      '<tr><th>Tecnologia</th><td>HTML, CSS e JavaScript em um único arquivo, sem bibliotecas. Progresso salvo no navegador (localStorage)</td></tr>'+
      '<tr><th>Limitações</th><td>O progresso fica só neste navegador e não é enviado a um ambiente virtual de aprendizagem (para isso, seria preciso empacotar em SCORM ou xAPI). Os módulos 2 a 6 estão planejados, não implementados</td></tr>'+
      '<tr><th>Autoria</th><td>Maiara Machado · concepção, design instrucional e roteiro</td></tr>'+
    '</tbody></table></div>'+pager()+'</section>';
};

/* ===================== RENDER ===================== */
function renderToc(){
  var html = "", lastGrp = undefined;
  html += '<ol>';
  SCREENS.forEach(function(s){
    if(s.grp!==lastGrp && s.grp){ html += '<li class="grp" aria-hidden="true">'+s.grp+'</li>'; }
    lastGrp = s.grp;
    var done = screenDone(s.id), seen = S.visited[s.id];
    html += '<li><button data-go="'+s.id+'"'+(S.current===s.id?' aria-current="page"':'')+'><span class="st '+(done?"done":(seen?"seen":""))+'" aria-hidden="true">'+(done?"✓":"")+'</span><span>'+esc(s.title)+'<span class="sr">'+(done?", concluído":(seen?", visitado":""))+'</span></span></button></li>';
  });
  html += '</ol>';
  html += '<a class="dl" href="apostila-design-thinking-m1.pdf" target="_blank" rel="noopener"><span class="dl-ic" aria-hidden="true">\u2193</span><span><b>Baixar apostila (PDF)</b><small>19 páginas · conteúdo, exercícios e gabarito</small></span></a>';
  document.getElementById("toc").innerHTML = html;
}
function renderProgress(){
  var t = totals();
  document.getElementById("progLabel").textContent = t.pct+"% concluído";
  document.getElementById("progFill").style.width = t.pct+"%";
}
function render(focus){
  if(!R[S.current]) S.current = "inicio";
  S.visited[S.current] = true; if(S.current!=="inicio") S.last = S.current; save();
  document.getElementById("main").innerHTML = R[S.current]();
  renderToc(); renderProgress();
  if(focus){ var el = document.getElementById(focus); if(el){ el.focus({preventScroll:false}); } }
}
function go(id){
  S.current = id; ui.errors = {}; ui.flipped = false; ui.confirmReset = false;
  try{ history.replaceState(null,"","#"+id); }catch(e){}
  render("h1"); window.scrollTo({top:0, behavior:"auto"});
  var toc = document.getElementById("toc"); toc.classList.remove("open"); document.getElementById("menuBtn").setAttribute("aria-expanded","false");
}

/* ===================== EVENTOS ===================== */
document.addEventListener("click", function(ev){
  var b = ev.target.closest("button"); if(!b) return;
  if(b.id==="menuBtn"){ var toc=document.getElementById("toc"); var open=toc.classList.toggle("open"); b.setAttribute("aria-expanded",String(open)); return; }
  if(b.dataset.go){ go(b.dataset.go); return; }
  if(b.dataset.scen!==undefined){ S.simIndex = +b.dataset.scen; ui.errors = {}; save(); render("h1"); return; }
  if(b.dataset.card!==undefined){ S.cardIndex = +b.dataset.card; ui.flipped = false; save(); render(); return; }
  if(b.dataset.rate){
    var list = S.cardFilter ? CARDS.filter(function(c){ return S.cards[c.id]!=="ok"; }) : CARDS;
    var c = list[Math.min(S.cardIndex,list.length-1)];
    S.cards[c.id] = b.dataset.rate; save();
    announce("Autoavaliação registrada.");
    if(!S.cardFilter && S.cardIndex < CARDS.length-1){ S.cardIndex++; ui.flipped = false; }
    else if(S.cardFilter){ ui.flipped = false; var nl = CARDS.filter(function(x){ return S.cards[x.id]!=="ok"; }); if(S.cardIndex>=nl.length) S.cardIndex = Math.max(0,nl.length-1); }
    render(); return;
  }
  var act = b.dataset.act; if(!act) return;
  if(act==="reopen"){ S.opening = null; save(); render(); return; }
  if(act==="retry"){ delete S.checks[b.dataset.id]; delete ui.revealed[b.dataset.id]; save(); render("f-"+b.dataset.id); return; }
  if(act==="reveal"){ ui.revealed[b.dataset.id] = true; render(); return; }
  if(act==="simretry"){ var s = SCENARIOS[S.simIndex]; delete S.sim[s.id]; save(); render("f-sim"); return; }
  if(act==="flip"){ ui.flipped = true; render(); var r=document.querySelector("[data-rate]"); if(r) r.focus(); return; }
  if(act==="cardfilter"){ S.cardFilter = !S.cardFilter; S.cardIndex = 0; ui.flipped = false; save(); render(); return; }
  if(act==="copy"){
    var ta = document.getElementById("exportBox"), msg = document.getElementById("copyMsg");
    function fallback(){ ta.focus(); ta.select(); msg.textContent = "Texto selecionado. Use Ctrl+C (ou Cmd+C) para copiar."; }
    try{ navigator.clipboard.writeText(ta.value).then(function(){ msg.textContent = "Registro copiado."; }, fallback); }catch(e){ fallback(); }
    return;
  }
  if(act==="reset"){ ui.confirmReset = true; render(); var y=document.querySelector('[data-act="resetyes"]'); if(y) y.focus(); return; }
  if(act==="resetno"){ ui.confirmReset = false; render(); return; }
  if(act==="resetyes"){ S = blank(); ui = {revealed:{}, flipped:false, confirmReset:false, errors:{}}; try{ localStorage.removeItem(KEY); }catch(e){} announce("Módulo reiniciado."); go("inicio"); return; }
});

document.addEventListener("submit", function(ev){
  var f = ev.target; ev.preventDefault();
  if(f.id==="f-opening"){
    var v = f.querySelector('input[name="opening"]:checked');
    if(!v){ ui.errors.opening = true; render(); return; }
    ui.errors.opening = false; S.opening = v.value; save(); render("fb-opening"); return;
  }
  if(f.dataset.check){
    var id = f.dataset.check, c = CHECKS[id];
    if(c.type==="single"){
      var o = f.querySelector('input[name="'+id+'"]:checked');
      if(!o){ ui.errors[id] = "Escolha uma opção antes de verificar."; render(); return; }
      var ok = c.options.filter(function(x){return x.id===o.value;})[0].ok;
      S.checks[id] = {ans:o.value, score:ok?1:0, total:1};
    } else {
      var ans = {}, missing = false, score = 0;
      c.items.forEach(function(it){ var x = f.querySelector('input[name="'+id+'-'+it.id+'"]:checked'); if(!x) missing = true; else { ans[it.id] = x.value; if(x.value===it.ans) score++; } });
      if(missing){ ui.errors[id] = "Classifique todos os itens antes de verificar."; render(); return; }
      S.checks[id] = {ans:ans, score:score, total:c.items.length};
    }
    ui.errors[id] = null; save(); render("fb-"+id); return;
  }
  if(f.id==="f-sim"){
    var s = SCENARIOS[S.simIndex];
    var a = f.querySelector('input[name="ap"]:checked'), e = f.querySelector('input[name="ev"]:checked');
    if(!a || !e){ ui.errors.sim = !a && !e ? "Escolha a abordagem e o dado que a sustenta." : (!a ? "Escolha a abordagem que você recomenda." : "Escolha o dado que sustenta sua decisão."); render(); return; }
    ui.errors.sim = null;
    S.sim[s.id] = {a:a.value, e:e.value};
    S.simTries[s.id] = (S.simTries[s.id]||0)+1;
    save(); render("fb-sim"); return;
  }
});

/* ===================== INÍCIO ===================== */
try{ localStorage.setItem(KEY+"-t","1"); localStorage.removeItem(KEY+"-t"); }catch(e){ storageOk = false; }
var h = (location.hash||"").replace("#","");
if(h && R[h]) S.current = h;
render();
})();
</script>
